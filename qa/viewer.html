<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>QA harness</title>
<style>html,body{margin:0;height:100%}#app{height:100vh}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createViewer } from '../src/embed';
const params = new URLSearchParams(location.search);
const file = params.get('file') || '/samples/RA6E2-eprj3/RA6E2-eprj3.zip';
const open = params.get('open') || '';
const opts = {};
if (params.get('theme')) opts.theme = params.get('theme');
if (params.get('lang')) opts.lang = params.get('lang');
const chrome = {};
for (const k of ['toolbar', 'left', 'right', 'status']) {
  const v = params.get(k);
  if (v != null) chrome[k] = v === '1' || v === 'true';
}
if (Object.keys(chrome).length) opts.chrome = chrome;
document.documentElement.dataset.theme = opts.theme ?? 'light';
const v = createViewer(document.getElementById('app'), opts);
if (file && file !== 'none') {
  const buf = await fetch(file).then((r) => r.arrayBuffer());
  await v.loadFiles([new File([buf], file.split('/').pop())]);
}
if (open) {
  const model = v.getModel();
  let hit = null;
  for (const [id, n] of model.openables) if (n.title === open || n.docType === open.toUpperCase()) { hit = id; break; }
  if (hit) v.open(hit);
  else console.warn('QA: node not found for', open);
}
// simulate wheel zoom centered at a canvas point: zoom=fx,fy,times
if (params.get('zoom')) {
  const [fx, fy, times] = params.get('zoom').split(',').map(Number);
  await new Promise((r) => setTimeout(r, 250));
  const cv = document.querySelector('.ev-canvas');
  const rect = cv.getBoundingClientRect();
  const x = rect.left + rect.width * fx, y = rect.top + rect.height * fy;
  for (let i = 0; i < (times || 2); i++)
    cv.dispatchEvent(new WheelEvent('wheel', { deltaY: -400, clientX: x, clientY: y, bubbles: true, cancelable: true }));
}
// scene-tree text dump: walk the live leafer tree, list every Text with its path
if (params.get('dump')) {
  const { root } = window.__ev ?? {};
  if (!root) throw new Error('dump: window.__ev not set (add debug hook in shell.ts)');
  const lines = [];
  const walk = (n, path) => {
    const name = n.name || n.constructor?.name || '?';
    const p = `${path}>${name}`;
    if (n.constructor?.name === 'Text' || typeof n.text === 'string')
      lines.push(`TEXT "${n.text}" fs=${n.fontSize} ${p} x=${Math.round(n.x ?? 0)} y=${Math.round(n.y ?? 0)}`);
    for (const c of n.children ?? []) walk(c, p);
  };
  walk(root, '');
  document.getElementById('app').innerHTML = `<pre style="font:9px/1.3 monospace;margin:4px">${lines.join('\n')}</pre>`;
}
// simulate an OS file drop: drop=<path>[,<name>]  (#32 repro)
if (params.get('drop')) {
  const spec = params.get('drop');
  const [p, name] = spec.includes(',') ? spec.split(',') : [spec, spec.split('/').pop()];
  const buf = await fetch(p).then((r) => r.arrayBuffer());
  const f = new File([buf], name || 'file');
  const dt = new DataTransfer();
  dt.items.add(f);
  const cv = document.querySelector('.ev-canvas') || document.getElementById('app');
  const rect = cv.getBoundingClientRect();
  const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
  for (const [type, extra] of [['dragenter', {}], ['dragover', {}], ['drop', { dataTransfer: dt }]])
    cv.dispatchEvent(new DragEvent(type, { clientX: x, clientY: y, bubbles: true, cancelable: true, ...extra }));
}
// simulate a left click at a canvas point (0..1 coords) to drive the picker
if (params.get('click')) {
  const [fx, fy] = params.get('click').split(',').map(Number);
  await new Promise((r) => setTimeout(r, 250));
  const cv = document.querySelector('.ev-canvas');
  const rect = cv.getBoundingClientRect();
  const x = rect.left + rect.width * fx, y = rect.top + rect.height * fy;
  cv.dispatchEvent(new PointerEvent('pointerup', { button: 0, clientX: x, clientY: y, bubbles: true }));
}
window.__qaReady = true;
</script>
</body>
</html>
